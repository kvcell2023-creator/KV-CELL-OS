<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KV CELL PDV</title><style>
:root{--y:#ffd400;--bg:#080808;--card:#121212;--line:#292929;--muted:#aaa}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#eee;font-family:Arial,sans-serif}aside{position:fixed;width:235px;height:100vh;background:#0c0c0c;border-right:1px solid var(--line);padding:20px 12px}
.logo{font-size:27px;font-weight:900;color:var(--y);padding:10px;margin-bottom:22px}.logo span{color:#fff}nav a{display:block;color:#ccc;text-decoration:none;padding:12px;border-radius:9px;margin:4px 0}nav a:hover{background:#222}
main{margin-left:235px;padding:30px;max-width:1550px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.metric{font-size:28px;font-weight:900;margin-top:8px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.full{grid-column:1/-1}
label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;background:#080808;color:#fff;border:1px solid #333;border-radius:9px;padding:11px}textarea{min-height:75px}
button,.btn{display:inline-block;background:var(--y);color:#080808;border:0;border-radius:9px;padding:11px 16px;font-weight:900;text-decoration:none;cursor:pointer;margin-top:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:#aaa;text-transform:uppercase}
.badge{background:#242424;border-radius:20px;padding:5px 9px}.profit{font-weight:900}.note{border-left:3px solid var(--y);padding:10px 14px;background:#171717;margin:15px 0}
@media(max-width:850px){aside{position:relative;width:100%;height:auto}main{margin-left:0}.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><aside><div class="logo">KV <span>CELL</span></div><nav>
<a href="/">📊 Dashboard</a><a href="/pdv">🛒 PDV</a><a href="/os">🔧 Ordens de Serviço</a><a href="/compras">📦 Compra de Peças</a><a href="/fornecedores">🚚 Fornecedores</a><a href="/clientes">👤 Clientes</a><a href="/relatorios">📈 Relatórios</a>
</nav></aside><main>{% block content %}{% endblock %}</main></body></html>
