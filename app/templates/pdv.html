{% extends "base.html" %}{% block content %}<h1>PDV</h1><form method="post"><div class="fields"><div><label>Cliente</label><select name="customer_id"><option value="">Consumidor</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div><label>OS</label><select name="order_id"><option value="">Venda avulsa</option>{% for o in orders %}<option value="{{o.id}}">OS #{{o.id}} • {{o.customer}}</option>{% endfor %}</select></div><div><label>Total</label><input name="total" type="number" step=".01" required></div><div><label>Pagamento</label><select name="payment"><option>PIX</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Transferência</option></select></div></div><button>Finalizar venda</button></form>{% if request.query_params.get('ok') %}<p class="profit">✓ Venda lançada no caixa.</p>{% endif %}{% endblock %}
